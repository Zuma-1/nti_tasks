<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness</title>

    <!-- link css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"  />

    <link rel="stylesheet" href="./main.css">


</head>
<body>



<div class="parent-inputs w-75 mx-auto d-flex align-items-center column-gap-2 my-2">

<div class="mb-3 w-50 m-0">
  <label for="steps" class="form-label">الخطوات</label>
  <input type="email" class="form-control" id="steps" placeholder="ادخل عدد الخطوات....">
</div>

<div class="mb-3 w-50">
  <label for="distance" class="form-label">المسافه</label>
  <input class="form-control" id="distance" placeholder="ادخل المسافه بال (Km)......"/>
</div>

<div class="mb-3 w-50">
  <label for="calory" class="form-label">السعرات</label>
  <input class="form-control" id="calory" placeholder="ادخل عدد السعرات...."/>
</div>

</div>
<div id="alert" class="alert alert-success w-50 text-center fs-4 mx-auto d-none">تمام اضافه البيانات بنجاح</div>
<div id="alert2" class="alert alert-danger d-none w-50 text-center fs-4 mx-auto d-none">يرجي اعادة كتابة البيانات</div>
<div class="btns d-flex align-content-center justify-content-center column-gap-2">
<button class="btn btn-outline-success" id="addCart">اضف</button>
<button class="btn btn-outline-danger" id="deleteCart">مسح</button>
</div>



<div class="container">
<div class="row" id="myRow">
<div class="col-md-4 bg-success text-white p-2 rounded-2" id="cart">
<h2>عدد الخطوات :<span id="stepsOutput"></span></h2>
<h2>عدد المسافه :<span id="distanceOutput"></span></h2>
<h2>عدد السعرات :<span id="caloryOutput"></span></h2>
</div>
</div>
</div>




<script src="main.js"></script>    
</body>
</html>
